name: "heldfast"
description: "Scan MCP server configurations and agent skills for security issues"
author: "rufat325"
branding:
  icon: "shield"
  color: "orange"

inputs:
  path:
    description: "Directory or file to scan"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the job (critical, high, medium, low, info, never)"
    required: false
    default: "high"
  format:
    description: "Report format written to `output` (text, json, sarif)"
    required: false
    default: "sarif"
  output:
    description: "Path for the report file"
    required: false
    default: "heldfast.sarif"
  probe:
    description: >-
      Connect to every server and read its live tool definitions. This LAUNCHES
      local STDIO servers, so leave it off unless the runner is disposable and
      you trust the servers enough to execute them.
    required: false
    default: "false"
  probe-hosted:
    description: >-
      Read each hosted (HTTP) server's tool definitions and compare them with
      the lock, so a tool rewritten since approval fails the job. Reading a
      hosted server's tool list runs none of its code. A server that cannot be
      read (it wants a login, the network failed, it timed out) is reported as
      not verified and does not fail the job unless `require-probe` is true.
    required: false
    default: "true"
  require-probe:
    description: >-
      Fail the job when a server that was asked for its tool definitions did
      not answer, instead of reporting it as not verified.
    required: false
    default: "false"
  scan-user-configs:
    description: "Also scan per-user config locations on the runner"
    required: false
    default: "false"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning"
    required: false
    default: "true"
  python-version:
    description: "Python version used to run the scanner"
    required: false
    default: "3.12"
  inventory:
    description: >-
      Also write this repository's `heldfast inventory` (JSON) to this path, for
      `heldfast fleet` to join with every other repository's and machine's.
      Reads configs only; launches nothing. Empty writes none.
    required: false
    default: ""
  inventory-label:
    description: "What to call this repository in a fleet report (default: owner/repo)"
    required: false
    default: ""
  org-policy:
    description: >-
      An organisation policy file (heldfast.org-policy/1). The repository's
      MCP servers are checked against it, and a violation fails the job.
    required: false
    default: ""

outputs:
  findings:
    description: "Total number of findings reported"
    value: ${{ steps.scan.outputs.findings }}
  highest-severity:
    description: "Highest severity observed, or 'none'"
    value: ${{ steps.scan.outputs.highest-severity }}
  unverified:
    description: "Servers asked for their tool definitions that did not answer"
    value: ${{ steps.scan.outputs.unverified }}
  report:
    description: "Path to the written report file"
    value: ${{ steps.scan.outputs.report }}
  inventory:
    description: "Path to the written inventory, when one was asked for"
    value: ${{ steps.inventory.outputs.inventory }}
  policy-violations:
    description: "Servers that break the organisation policy at deny level"
    value: ${{ steps.inventory.outputs.violations }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install heldfast
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Scan
      id: scan
      shell: bash
      # Every input is passed through the environment rather than interpolated
      # into the script body. A ${{ }} expansion inside `run:` is textual
      # substitution before bash ever sees it, which makes any input that can
      # carry a quote a shell injection. That is worth avoiding anywhere; in a
      # security tool's own action it is not optional.
      env:
        IN_PATH: ${{ inputs.path }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_PROBE: ${{ inputs.probe }}
        IN_PROBE_HOSTED: ${{ inputs.probe-hosted }}
        IN_USER_CONFIGS: ${{ inputs.scan-user-configs }}
      run: |
        set -euo pipefail

        # One flag set, used by every invocation below. The previous version
        # built different flags for the report, the summary and the gate, so a
        # finding that needed --probe was reported but never enforced.
        common=(scan "$IN_PATH")
        if [ "$IN_PROBE" = "true" ]; then
          common+=(--probe)
        elif [ "$IN_PROBE_HOSTED" = "true" ]; then
          # Hosted servers only: reading one runs nothing; a stdio one would run.
          common+=(--probe --no-stdio-probe)
        fi
        if [ "$IN_USER_CONFIGS" != "true" ]; then
          common+=(--no-user-configs)
        fi

        summary="$RUNNER_TEMP/heldfast-summary.json"
        heldfast "${common[@]}" --format json --output "$summary" --fail-on never

        if [ "$IN_FORMAT" = "json" ]; then
          cp "$summary" "$IN_OUTPUT"
        else
          heldfast "${common[@]}" --format "$IN_FORMAT" --output "$IN_OUTPUT" --fail-on never
        fi

        total=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['summary']['total'])" "$summary")
        highest=$(python -c "import json,sys;d=json.load(open(sys.argv[1]))['summary'];print(d['highest'] if d['total'] else 'none')" "$summary")

        unverified=$(python -c "import json,sys;print(sum(1 for p in json.load(open(sys.argv[1])).get('probe', []) if p['state'] == 'could not read'))" "$summary")

        {
          echo "findings=$total"
          echo "highest-severity=$highest"
          echo "unverified=$unverified"
          echo "report=$IN_OUTPUT"
        } >> "$GITHUB_OUTPUT"

        # Print the findings into the log. A report written only to a file is
        # a report nobody reads.
        heldfast "${common[@]}" --format text --fail-on never --no-color || true

        {
          echo "### heldfast"
          echo ""
          echo "\`$total\` finding(s), highest severity: \`$highest\`"
          echo ""
          python -m heldfast.report.probe_summary "$summary"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Inventory
      id: inventory
      if: ${{ inputs.inventory != '' || inputs.org-policy != '' }}
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_INVENTORY: ${{ inputs.inventory }}
        IN_LABEL: ${{ inputs.inventory-label }}
        IN_ORG_POLICY: ${{ inputs.org-policy }}
      run: |
        set -euo pipefail
        args=(inventory "$IN_PATH" --no-user-configs --label "${IN_LABEL:-$GITHUB_REPOSITORY}")
        if [ -n "$IN_ORG_POLICY" ]; then
          args+=(--policy "$IN_ORG_POLICY")
        fi
        out="${IN_INVENTORY:-$RUNNER_TEMP/heldfast-inventory.json}"
        status=0
        heldfast "${args[@]}" -f json -o "$out" || status=$?
        if [ "$status" = "2" ]; then
          echo "heldfast: the inventory could not be written (see above)"
          exit 2
        fi
        violations=$(python -c "import json,sys;print(sum(1 for v in json.load(open(sys.argv[1])).get('policy', {}).get('violations', []) if v['level'] == 'deny'))" "$out")
        {
          echo "inventory=$out"
          echo "violations=$violations"
        } >> "$GITHUB_OUTPUT"
        heldfast "${args[@]}" --no-color || true

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' && hashFiles(inputs.output) != '' }}
      uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        sarif_file: ${{ inputs.output }}
        category: heldfast

    - name: Require every probed server to answer
      if: ${{ inputs.require-probe == 'true' }}
      shell: bash
      env:
        UNVERIFIED: ${{ steps.scan.outputs.unverified }}
      run: |
        if [ "${UNVERIFIED:-0}" != "0" ]; then
          echo "heldfast: $UNVERIFIED server(s) could not be read, and require-probe is on"
          exit 1
        fi

    - name: Enforce threshold
      if: ${{ inputs.fail-on != 'never' }}
      shell: bash
      env:
        IN_FAIL_ON: ${{ inputs.fail-on }}
        FINDINGS: ${{ steps.scan.outputs.findings }}
        HIGHEST: ${{ steps.scan.outputs.highest-severity }}
      # Decided from the scan that already ran, so the gate enforces exactly
      # what the report showed. Re-scanning here would be a third pass and
      # could disagree with the artifact that was just uploaded.
      run: |
        set -euo pipefail
        python - <<'EOF'
        import os, sys
        order = ["info", "low", "medium", "high", "critical"]
        threshold = os.environ["IN_FAIL_ON"]
        highest = os.environ["HIGHEST"]
        total = int(os.environ["FINDINGS"] or 0)
        if total == 0 or highest == "none":
            print("heldfast: no findings")
            sys.exit(0)
        if order.index(highest) >= order.index(threshold):
            print(f"heldfast: {total} finding(s); highest '{highest}' "
                  f"meets or exceeds the '{threshold}' threshold")
            sys.exit(1)
        print(f"heldfast: {total} finding(s); highest '{highest}' is below "
              f"the '{threshold}' threshold")
        EOF

    - name: Enforce the organisation policy
      if: ${{ inputs.org-policy != '' }}
      shell: bash
      env:
        VIOLATIONS: ${{ steps.inventory.outputs.violations }}
      run: |
        if [ "${VIOLATIONS:-0}" != "0" ]; then
          echo "heldfast: $VIOLATIONS server(s) break the organisation policy"
          exit 1
        fi
        echo "heldfast: every server meets the organisation policy"
