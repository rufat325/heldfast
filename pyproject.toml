[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-audit"
version = "0.1.0"
description = "Zero-dependency security scanner for MCP servers and agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["mcp", "security", "ai-agents", "supply-chain", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# No runtime dependencies. This is deliberate: a supply-chain scanner that
# pulls in a dependency tree is asking you to trust the thing it is auditing.
dependencies = []

[project.urls]
Homepage = "https://github.com/mcp-audit/mcp-audit"
Issues = "https://github.com/mcp-audit/mcp-audit/issues"

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
