[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-pin"
version = "0.1.6"
description = "Zero-dependency tool-integrity pin for MCP servers and agent skills: approve once, refuse what changed"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Rufat Mahmudov" }]
keywords = ["mcp", "security", "ai-agents", "supply-chain", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# No runtime dependencies. This is deliberate: a supply-chain scanner that
# pulls in a dependency tree is asking you to trust the thing it is auditing.
dependencies = []

[project.optional-dependencies]
# The MCPA018 semantic tier only. Keeping it an extra means the scanner every
# user installs stays dependency-free, and only those who opt into sending
# text to an API take on the SDK.
llm = ["anthropic>=1.0"]

[project.urls]
Homepage = "https://github.com/rufat325/mcp-pin"
Repository = "https://github.com/rufat325/mcp-pin"
Issues = "https://github.com/rufat325/mcp-pin/issues"

[project.scripts]
mcp-pin = "mcp_pin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
