# Notices the drift feed stopping without failing, from the repository that
# changes every day. Copied into rufat325/heldfast-feed as
# .github/workflows/watchdog.yml; the logic is research/feed/watchdog.py in
# rufat325/heldfast, read from there at run time.
#
# It lives here, not in heldfast, because GitHub disables a public
# repository's scheduled workflows after 60 days without activity. This
# repository gets a commit every day while the feed runs, so its schedule
# stays on -- and if the collector in heldfast stops, even because its own
# schedule was disabled, this keeps running and opens an issue here, with this
# repository's own token and no other credential. Watch this repository to
# get the notification.
#
# Every hour it also looks for today's checkpoint. GitHub starts scheduled
# runs late under load, and sometimes not at all, while the four-hourly passes
# keep publishing -- so a missing daily run never looks like a stall, yet a
# day without a checkpoint can never be anchored afterwards. Once the daily
# run is overdue, this starts feed.yml by hand. That takes one more secret
# here, HELDFAST_DISPATCH_TOKEN: a fine-grained token for rufat325/heldfast
# alone, with Actions read and write, seen only by the step that starts the
# run. Without it, the same check opens an issue so a person can start the
# run. A workflow GitHub has disabled cannot be started this way.
name: watchdog

on:
  schedule:
    - cron: "17 */6 * * *"   # is the feed moving; is heldfast near the 60-day rule
    - cron: "47 * * * *"     # is today's checkpoint recorded
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    if: github.event.schedule != '47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rufat325/heldfast
          ref: main
          path: tool
          persist-credentials: false
      - name: Check that the feed is moving
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$REPO/commits/main" --jq .commit.committer.date)
          gh run list --repo rufat325/heldfast --workflow feed.yml --status in_progress \
            --json createdAt,url > runs.json
          if problems=$(python3 tool/research/feed/watchdog.py check --last-change "$last" --runs runs.json); then
            echo "$problems"
            exit 0
          fi
          title="feed: stalled"
          body=$(printf 'The drift feed has stopped moving:\n\n%s\n\nThe collector is `feed.yml` in rufat325/heldfast. A run that hangs holds its concurrency group, so later runs wait behind it: cancel it on the Actions tab. If GitHub disabled the schedule after 60 days without activity, enable feed.yml again there.' "$problems")
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body" >/dev/null
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" >/dev/null
          fi
          echo "$problems"
      # The early warning for GitHub's 60-day rule. rufat325/heldfast, where
      # feed.yml's schedule lives, is active only when someone commits to it.
      # This opens its own issue ten days before the deadline, so a person
      # makes a real commit; it does not commit or re-enable anything itself.
      - name: Warn before the collector's schedule goes idle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(gh api repos/rufat325/heldfast/commits/main --jq .commit.committer.date)
          if warning=$(python3 tool/research/feed/watchdog.py idle --last-change "$last"); then
            echo "$warning"
            exit 0
          fi
          title="heldfast: a commit is needed to keep the collector running"
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$warning" >/dev/null
          else
            gh issue create --repo "$REPO" --title "$title" --body "$warning" >/dev/null
          fi
          echo "$warning"

  # Today's checkpoint, every hour. watchdog.py decides; this step list only
  # carries the decision out.
  checkpoint:
    if: github.event.schedule != '17 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rufat325/heldfast
          ref: main
          path: tool
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: feed
          sparse-checkout: checkpoints
          filter: blob:none
          persist-credentials: false
      - name: Decide about today's checkpoint
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo rufat325/heldfast --workflow feed.yml --limit 40 \
            --json createdAt,event,status,url > runs.json
          decision=$(python3 tool/research/feed/watchdog.py daily --checkpoints feed/checkpoints --runs runs.json)
          echo "$decision" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "action=${decision%%:*}" >> "$GITHUB_OUTPUT"
          echo "reason=${decision#*: }" >> "$GITHUB_OUTPUT"
      # The only step that sees the dispatch token. It runs no code from either
      # repository, only gh, and only when the decision above says start.
      - name: Start the daily run
        id: start
        if: steps.decide.outputs.action == 'start'
        env:
          GH_TOKEN: ${{ secrets.HELDFAST_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "outcome=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh workflow run feed.yml --repo rufat325/heldfast --ref main 2> refused.txt; then
            echo "outcome=started" >> "$GITHUB_OUTPUT"
            echo "started feed.yml" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "outcome=refused" >> "$GITHUB_OUTPUT"
            cat refused.txt
          fi
      - name: Say so
        if: >-
          steps.decide.outputs.action == 'alert' ||
          (steps.decide.outputs.action == 'start' && steps.start.outputs.outcome != 'started')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.decide.outputs.reason }}
          OUTCOME: ${{ steps.start.outputs.outcome }}
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          title="feed: no checkpoint for $day"
          case "${OUTCOME:-}" in
            no-token) next="Start feed.yml by hand: https://github.com/rufat325/heldfast/actions/workflows/feed.yml (Run workflow, on main). To let this watchdog start it, add the HELDFAST_DISPATCH_TOKEN secret here, as the header of .github/workflows/watchdog.yml describes." ;;
            refused) next="GitHub refused to start feed.yml: $(cat refused.txt 2>/dev/null || true). If the workflow is disabled, turn it back on from heldfast's Actions tab; if the token has expired, replace HELDFAST_DISPATCH_TOKEN." ;;
            *) next="The watchdog starts no more runs today." ;;
          esac
          body=$(printf '%s\n\n%s\n\nA day without a checkpoint can never be anchored afterwards: a stamp made later proves only that the data existed later.' "$REASON" "$next")
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "already reported in #$number"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" >/dev/null
          fi
          echo "$body"
