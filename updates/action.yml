# Dependabot for MCP tools. Run it on a schedule in a repository that commits
# an MCP config and its .mcp-pin.lock:
#
#   on: { schedule: [{ cron: "0 6 * * 1" }], workflow_dispatch: {} }
#   permissions: { contents: write, pull-requests: write, issues: write }
#   jobs:
#     updates:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: rufat325/heldfast/updates@<sha>
#
# For each server pinned to an exact npm version, it asks the drift feed what
# newer releases changed, and OSV and the npm registry what is known about
# them. A release reported as malware, pulled from npm, or younger than
# min-age days is never proposed; one that adds an install script needs
# review. Quiet updates -- no critical tool change, and nothing public
# names the release -- are applied and opened as one pull request. The rest are
# listed in one issue; nothing is applied for them. If a pinned release is
# itself reported as malware, the issue says so first and the job fails.
#
# heldfast is installed from this action's own commit, so pinning the action
# to a SHA pins the code that runs. Inputs reach the shell as environment
# variables, never as text pasted into a script.
name: heldfast updates
description: Open a pull request for quiet MCP server updates, and an issue for the ones to review.
author: rufat325
branding:
  icon: lock
  color: gray-dark

inputs:
  path:
    description: Directory holding the MCP configuration and .mcp-pin.lock
    default: "."
  apply:
    description: Apply quiet updates to the working tree ("false" only reports)
    default: "true"
  min-age:
    description: Propose only releases at least this many days old
    default: "14"
  open-pr:
    description: Open or update a pull request with the applied updates
    default: "true"
  open-issue:
    description: Open or update an issue listing updates that need review
    default: "true"
  branch:
    description: Branch the pull request is pushed to
    default: heldfast/updates
  token:
    description: Token for pushing the branch and opening the PR and issue
    default: ${{ github.token }}

outputs:
  quiet:
    description: Number of quiet updates found
    value: ${{ steps.check.outputs.quiet }}
  review:
    description: Number of updates that need review
    value: ${{ steps.check.outputs.review }}
  waiting:
    description: Number of servers whose newer releases are younger than min-age
    value: ${{ steps.check.outputs.waiting }}
  blocked:
    description: Number of servers whose every newer release is reported as malware or pulled
    value: ${{ steps.check.outputs.blocked }}
  malware:
    description: Number of pinned releases reported as malware
    value: ${{ steps.check.outputs.malware }}
  pull-request:
    description: URL of the pull request, if one was opened or updated
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install heldfast from this action's commit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH/.."

    - name: Check the pinned servers against the feed
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        MIN_AGE: ${{ inputs.min-age }}
      run: |
        set -euo pipefail
        # Exit 1 means a pinned release is reported as malware. That is
        # reported below and fails the job at the end, after the issue is open.
        rc=0
        heldfast updates "$TARGET" --no-user-configs --no-skills --min-age "$MIN_AGE" \
          --format json > "$RUNNER_TEMP/updates.json" || rc=$?
        if [ "$rc" -gt 1 ]; then exit "$rc"; fi
        heldfast updates "$TARGET" --no-user-configs --no-skills --min-age "$MIN_AGE" \
          > "$RUNNER_TEMP/updates.txt" || true
        python - "$RUNNER_TEMP/updates.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        servers = json.load(open(sys.argv[1], encoding="utf-8"))["servers"]
        for grade in ("quiet", "review", "waiting", "blocked"):
            print(f"{grade}={sum(s['grade'] == grade for s in servers)}")
        print(f"malware={sum(bool(s.get('alarm')) for s in servers)}")
        print(f"attention={sum(s['grade'] in ('review', 'blocked') or bool(s.get('alarm')) for s in servers)}")
        PY
        {
          echo '## heldfast updates'
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Apply the quiet updates
      if: steps.check.outputs.quiet != '0' && inputs.apply == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        MIN_AGE: ${{ inputs.min-age }}
      run: |
        rc=0
        heldfast updates --apply "$TARGET" --no-user-configs --no-skills --min-age "$MIN_AGE" || rc=$?
        if [ "$rc" -gt 1 ]; then exit "$rc"; fi

    - name: Open or update the pull request
      id: pr
      if: steps.check.outputs.quiet != '0' && inputs.apply == 'true' && inputs.open-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        TARGET: ${{ inputs.path }}
      run: |
        set -euo pipefail
        # Only files git already tracks: the config and the lock. Nothing
        # else in the workspace can ride along into the pull request.
        git add -u -- "$TARGET"
        if git diff --cached --quiet; then
          echo "the quiet updates changed no tracked file"; exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git commit -q -m "Bump MCP servers with quiet tool changes" \
                      -m "Applied by heldfast updates --apply: each change is one approve --yes would write."
        git push --force origin "$BRANCH"
        {
          echo 'Servers pinned to an exact version whose newer release the [drift feed](https://github.com/rufat325/heldfast/tree/feed) has measured.'
          echo 'Each change here is **quiet**: no tool change is critical (one `heldfast approve --yes` would write), no advisory in OSV names the release, it adds no install script, and it has been published long enough for a malicious release to have been reported. Nobody has read its code. Updates that need review are not in this PR.'
          echo
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } > "$RUNNER_TEMP/body.md"
        if url=$(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null); then
          gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md" >/dev/null
        else
          url=$(gh pr create --head "$BRANCH" --title "heldfast: quiet MCP server updates" \
                             --body-file "$RUNNER_TEMP/body.md")
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Open or update the review issue
      if: steps.check.outputs.attention != '0' && inputs.open-issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MALWARE: ${{ steps.check.outputs.malware }}
      run: |
        set -euo pipefail
        title="heldfast: MCP server updates to review"
        {
          if [ "$MALWARE" != "0" ]; then
            echo '> [!CAUTION]'
            echo '> A release this configuration runs is reported as malware (see MALWARE below). Remove it, and rotate every credential the machines running it could reach.'
            echo
          fi
          echo 'These pinned servers need a person: a newer release changes a tool in a way `approve --yes` would not write, an advisory names it, it adds an install script, or every newer release was reported as malware or pulled.'
          echo 'Read what is named below. To take a release, bump the version and run `heldfast approve --from-feed`, which prints the diff and asks for `--yes-tool NAME` where a change is critical.'
          echo
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } > "$RUNNER_TEMP/issue.md"
        number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md" >/dev/null
        else
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md" >/dev/null
        fi

    - name: Fail on a pinned release reported as malware
      if: steps.check.outputs.malware != '0'
      shell: bash
      run: |
        echo "::error::a pinned MCP server release is reported as malware; see the job summary"
        exit 1
