# Dependabot for MCP tools. Run it on a schedule in a repository that commits
# an MCP config and its .mcp-pin.lock:
#
#   on: { schedule: [{ cron: "0 6 * * 1" }], workflow_dispatch: {} }
#   permissions: { contents: write, pull-requests: write, issues: write }
#   jobs:
#     updates:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: rufat325/mcp-pin/updates@<sha>
#
# For each server pinned to an exact npm version, it asks the drift feed what
# newer releases changed. Quiet updates -- what `approve --yes` would write --
# are applied and opened as one pull request. Updates that need review are
# listed in one issue, with the tools to read; nothing is applied for them.
#
# mcp-pin is installed from this action's own commit, so pinning the action
# to a SHA pins the code that runs. Inputs reach the shell as environment
# variables, never as text pasted into a script.
name: mcp-pin updates
description: Open a pull request for quiet MCP server updates, and an issue for the ones to review.
author: rufat325
branding:
  icon: lock
  color: gray-dark

inputs:
  path:
    description: Directory holding the MCP configuration and .mcp-pin.lock
    default: "."
  apply:
    description: Apply quiet updates to the working tree ("false" only reports)
    default: "true"
  open-pr:
    description: Open or update a pull request with the applied updates
    default: "true"
  open-issue:
    description: Open or update an issue listing updates that need review
    default: "true"
  branch:
    description: Branch the pull request is pushed to
    default: mcp-pin/updates
  token:
    description: Token for pushing the branch and opening the PR and issue
    default: ${{ github.token }}

outputs:
  quiet:
    description: Number of quiet updates found
    value: ${{ steps.check.outputs.quiet }}
  review:
    description: Number of updates that need review
    value: ${{ steps.check.outputs.review }}
  pull-request:
    description: URL of the pull request, if one was opened or updated
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install mcp-pin from this action's commit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH/.."

    - name: Check the pinned servers against the feed
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
      run: |
        set -euo pipefail
        mcp-pin updates "$TARGET" --no-user-configs --no-skills --format json > "$RUNNER_TEMP/updates.json"
        mcp-pin updates "$TARGET" --no-user-configs --no-skills > "$RUNNER_TEMP/updates.txt"
        python - "$RUNNER_TEMP/updates.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        servers = json.load(open(sys.argv[1], encoding="utf-8"))["servers"]
        print(f"quiet={sum(s['grade'] == 'quiet' for s in servers)}")
        print(f"review={sum(s['grade'] == 'review' for s in servers)}")
        PY
        {
          echo '## mcp-pin updates'
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Apply the quiet updates
      if: steps.check.outputs.quiet != '0' && inputs.apply == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
      run: mcp-pin updates --apply "$TARGET" --no-user-configs --no-skills

    - name: Open or update the pull request
      id: pr
      if: steps.check.outputs.quiet != '0' && inputs.apply == 'true' && inputs.open-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        TARGET: ${{ inputs.path }}
      run: |
        set -euo pipefail
        # Only files git already tracks: the config and the lock. Nothing
        # else in the workspace can ride along into the pull request.
        git add -u -- "$TARGET"
        if git diff --cached --quiet; then
          echo "the quiet updates changed no tracked file"; exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git commit -q -m "Bump MCP servers with quiet tool changes" \
                      -m "Applied by mcp-pin updates --apply: each change is one approve --yes would write."
        git push --force origin "$BRANCH"
        {
          echo 'Servers pinned to an exact version whose newer release the [drift feed](https://github.com/rufat325/mcp-pin/tree/feed) has measured.'
          echo 'Each change here is **quiet**: one `mcp-pin approve --yes` would write. Updates that need review are not in this PR.'
          echo
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } > "$RUNNER_TEMP/body.md"
        if url=$(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null); then
          gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md" >/dev/null
        else
          url=$(gh pr create --head "$BRANCH" --title "mcp-pin: quiet MCP server updates" \
                             --body-file "$RUNNER_TEMP/body.md")
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Open or update the review issue
      if: steps.check.outputs.review != '0' && inputs.open-issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        title="mcp-pin: MCP server updates to review"
        {
          echo 'These pinned servers have a newer release with a change `approve --yes` would not write: a tool gained text the review grades critical.'
          echo 'Read the tools named below, then bump the version and run `mcp-pin approve --from-feed`, which prints the diff and asks for `--yes-tool NAME`.'
          echo
          echo '```'
          cat "$RUNNER_TEMP/updates.txt"
          echo '```'
        } > "$RUNNER_TEMP/issue.md"
        number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md" >/dev/null
        else
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md" >/dev/null
        fi
