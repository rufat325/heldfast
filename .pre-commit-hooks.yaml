- id: mcp-pin-check
  name: mcp-pin-check
  description: Verify .mcp-pin.lock is well-formed (MCPA014 if missing). Zero npm dependencies.
  language: node
  entry: node js/mcp-pin-check/bin.js
  pass_filenames: false
  files: '(^|/)\.mcp-pin\.lock$|(^|/)\.mcp\.json$'
- id: mcp-pin-ci
  name: mcp-pin ci
  description: Fail the commit on MCPA014/015. Never launches servers.
  language: python
  entry: python -m mcp_pin ci
  pass_filenames: false
  additional_dependencies: []
