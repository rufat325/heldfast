# Notices the drift feed stopping without failing. feed.yml's alert job
# reports a run that fails; a run that hangs, a schedule GitHub quietly stops
# firing, or a publish that commits nothing day after day never reaches it.
# Every six hours this checks that the feed branch has moved in the last 36
# hours and that no feed run has been going for more than six, and opens an
# issue -- or comments on the open one -- when either is not so.
name: feed-watchdog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check that the feed is moving
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          problems=""
          last=$(gh api "repos/$REPO/commits/feed" --jq .commit.committer.date)
          age=$(( (now - $(date -u -d "$last" +%s)) / 3600 ))
          if [ "$age" -ge 36 ]; then
            problems+="- the feed branch last changed ${age} hours ago (${last})"$'\n'
          fi
          while read -r created url; do
            [ -n "$created" ] || continue
            hours=$(( (now - $(date -u -d "$created" +%s)) / 3600 ))
            if [ "$hours" -ge 6 ]; then
              problems+="- a feed run has been going for ${hours} hours: ${url}"$'\n'
            fi
          done < <(gh run list --repo "$REPO" --workflow feed.yml --status in_progress \
                     --json createdAt,url --jq '.[] | "\(.createdAt) \(.url)"')
          if [ -z "$problems" ]; then
            echo "feed is moving: last change ${age} hours ago"
            exit 0
          fi
          title="feed: stalled"
          body=$(printf 'The drift feed has stopped moving:\n\n%s\nA run that hangs holds the `feed` concurrency group, so later runs wait behind it; cancelling it on the Actions tab lets the next one start.' "$problems")
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body" >/dev/null
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" >/dev/null
          fi
          echo "$problems"
